name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: gofmt -l ./... | tee /tmp/fmt.out && test ! -s /tmp/fmt.out
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: go build ./...
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # Миграции накатываются на чистый PG — ловит битый SQL до продакшена.
  migrate:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: retail
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U retail -d retail"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go run ./migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://retail:retail@localhost:5432/retail?sslmode=disable
      - run: go run ./migrations # идемпотентность: второй прогон = только skip
        working-directory: backend
        env:
          DATABASE_URL: postgres://retail:retail@localhost:5432/retail?sslmode=disable

  # Дымовой стенд: backend стартует, /healthz и /metrics отвечают.
  smoke:
    runs-on: ubuntu-latest
    needs: [backend, migrate]
    services:
      pg:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: retail
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U retail -d retail"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go run ./migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://retail:retail@localhost:5432/retail?sslmode=disable
      - run: |
          DATABASE_URL=postgres://retail:retail@localhost:5432/retail?sslmode=disable \
          REDIS_ADDR=localhost:6379 BACKEND_PORT=18080 \
          JWT_SECRET=ci-secret-min-32-chars-0123456789 \
          go run ./cmd/api & echo $! > /tmp/api.pid
          sleep 12
          curl -fsS localhost:18080/healthz
          curl -fsS localhost:18080/readyz
          curl -fsS localhost:18080/metrics | grep -q rms_http_requests_total
          kill $(cat /tmp/api.pid)
        working-directory: backend
