# Этап 1: только PG + Redis (alpine, ARM-friendly для M2).
# Backend и frontend запускаются НАТИВНО (go run / npm run dev) для экономии RAM.
# Профиль monitoring (Prometheus/Grafana) — только опционально, по умолчанию выключен.

services:
  pg:
    image: postgres:14-alpine
    container_name: retail-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail}
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retail} -d ${POSTGRES_DB:-retail}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: retail-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Swagger UI для docs/openapi.yaml: make swagger
  swagger:
    image: swaggerapi/swagger-ui:v5.17.0
    environment:
      SWAGGER_JSON: /docs/openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/docs/openapi.yaml:ro
    ports:
      - "${SWAGGER_PORT:-8081}:8080"
    profiles: ["docs"]

volumes:
  pgdata:
